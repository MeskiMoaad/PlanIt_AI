
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#F8F4F0] text-[#1E1B4B]">

    <header class="bg-[#03080a] text-white px-8 py-5 shadow-lg">

        <div class="flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                + PLANIT <span class="text-purple-400">AI</span> 
            </h1>
            <nav class="flex items-center gap-6">

                <a href="index.html"
                   class="bg-[#c2f700] px-4 py-2 rounded-xl text-[#101820]">
                    Dashboard
                </a>
        

                <a href="newProject.html"
                   class="px-4 py-2 rounded-xl bg- hover:bg-[#c2f700]">
                    + New Project
                </a>

               <button id="ai-settings-btn"
               class="px-4 py-2 rounded-xl hover:bg-[#c2f700]">
               AI Settings
            </button>

            </nav>

        </div>

    </header>
    
    <main class="p-8">

        <section class="flex justify-between items-center mb-10">

            <div>
                <h2 class="text-3xl font-bold mb-2">
                    Welcome back!
                </h2>

                <p class="text-[#03080a]">
                    Manage your projects and track your progress.
                </p>
            </div>

            <a href="new-project.html"
               class="bg-[#1E1B4B] text-white px-5 py-3 rounded-lg hover:bg-[#03080a]">
                + New Project
            </a>
        </section>

        <section class="grid grid-cols-3 gap-6 mb-10">

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Total Projects</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Total Tasks</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Completed Tasks</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

        </section>

        <!-- Projects -->
        <section>

            <div class="flex justify-between items-center mb-6">

                <h2 class="text-2xl font-bold">
                    Your Projects
                </h2>

                <button class="text-purple-700 font-semibold">
                    View the projects ²→
                </button>
            </div>

        </section>

    </main>
    <div id="ai-settings-modal"
    class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

        <h2 class="text-2xl font-bold mb-2">
            AI Settings
        </h2>

        <p class="text-gray-500 mb-6">
            Connect your Groq API Key
        </p>

        <label for="api-key" class="block font-semibold mb-2">
            Groq API Key
        </label>

        <input
            type="password"
            id="api-key"
            placeholder="Enter your API Key"
            class="w-full border border-gray-300 rounded-lg p-3 mb-4 outline-none focus:border-purple-600"
        >

        <div class="flex justify-end gap-3">

            <button id="close-settings"
                class="px-4 py-2 rounded-lg bg-gray-200">
                Cancel
            </button>

            <button id="save-api-key"
                class="px-4 py-2 rounded-lg bg-purple-600 text-white">
                Save
            </button>

        </div>

        <p id="settings-message" class="mt-4 text-sm"></p>

    </div>
</div>

</body>

</html>
