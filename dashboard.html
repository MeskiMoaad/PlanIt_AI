<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>PLANIT AI | Task Board</title>
</head>

<body class="bg-[#f4f7f8] min-h-screen text-gray-800">

    <main>
        <section class="max-w-7xl mx-auto px-5 md:px-10 py-10">

            <div class="mb-8 border-b border-gray-200 pb-6">
                <p
                    class="text-2xl md:text-3xl font-bold tracking-tight text-gray-800"
                    id="projet">
                </p>

                <p
                    class="mt-3 text-sm md:text-base text-gray-500"
                    id="hours">
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- To Do -->
                <article class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden">

                    <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                            <h3 class="font-semibold text-gray-700">To Do</h3>
                        </div>

                        <span
                            class="text-xs font-semibold bg-gray-100 text-gray-600 px-3 py-1 rounded-full"
                            id="todo-count">0</span>
                    </div>

                    <div id="to-do" class="p-4 space-y-3 min-h-64 bg-gray-50/60">
                    </div>

                </article>

                <!-- In Progress -->
                <article class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden">

                    <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                            <h3 class="font-semibold text-gray-700">In Progress</h3>
                        </div>

                        <span
                            class="text-xs font-semibold bg-blue-50 text-blue-600 px-3 py-1 rounded-full"
                            id="progress-count">0</span>
                    </div>

                    <div id="in-progress" class="p-4 space-y-3 min-h-64 bg-gray-50/60">
                    </div>

                </article>

                <!-- Done -->
                <article class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden">

                    <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <h3 class="font-semibold text-gray-700">Done</h3>
                        </div>

                        <span
                            class="text-xs font-semibold bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full"
                            id="done-count">0</span>
                    </div>

                    <div id="done" class="p-4 space-y-3 min-h-64 bg-gray-50/60">
                    </div>

                </article>

            </div>

        </section>
    </main>

    <script type="module" src="./dashboard.js"></script>
</body>
</html>
